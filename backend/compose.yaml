# Local Postgres and Valkey, the same major versions Render runs.
# Bound to 127.0.0.1 so the local password is never reachable from the network.
# Postgres uses host port 5433 so it never clashes with a Postgres already
# installed on the machine.
services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cv"]
      interval: 1s
      retries: 30

  valkey:
    image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      retries: 30
