[project]
name = "cv-autofill-backend"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use real CV punctuation, such as en dashes in date ranges.
"tests/**" = ["S101", "RUF001"]
# Generated. Pydantic copies `= []` defaults per instance, so RUF012 is a false
# alarm, and the generator's line lengths are not ours to fix.
"app/profile_v1.py" = ["RUF012", "E501"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# Test-only PDF builder without type hints.
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]

# `uv run datamodel-codegen` regenerates app/profile_v1.py. CI fails if the
# committed file differs.
[tool.datamodel-codegen]
input = "../packages/schema/profile.v1.schema.json"
input-file-type = "jsonschema"
output = "app/profile_v1.py"
output-model-type = "pydantic_v2.BaseModel"
base-class = "app.profile_base.Base"
class-name = "ProfileV1"
target-python-version = "3.14"
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
# Zod's own email and id patterns are in the schema; Pydantic's types differ.
type-mappings = ["email=string", "uuid=string"]
enum-field-as-literal = "all"
use-type-alias = true
disable-timestamp = true
formatters = ["ruff-format", "ruff-check"]
custom-file-header = "# Generated from packages/schema/profile.v1.schema.json. Do not edit:\n# run `uv run datamodel-codegen` instead."
